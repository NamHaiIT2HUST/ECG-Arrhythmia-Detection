# CP6.3: docker compose up -d chạy toàn bộ hệ thống (backend + frontend).
# Yêu cầu TRƯỚC KHI chạy: saved_models/*.pth và data/raw/physionet_mitdb/ đã có sẵn ở host
# (gitignored, không nằm trong image - xem backend.Dockerfile). Nếu thiếu, backend container
# vẫn khởi động được nhưng AI service sẽ báo "Không tìm thấy model".
services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      # Frontend giờ gọi qua đường dẫn tương đối, proxy qua Nginx (container frontend) sang
      # backend:8000 trong mạng nội bộ Docker - không còn PHỤ THUỘC port này publish ra host.
      # Vẫn giữ publish để tiện gọi thẳng API/debug từ máy host khi cần (vd curl localhost:8000/api/records).
      - "8000:8000"
    volumes:
      - ./saved_models:/app/saved_models
      - ./data/raw:/app/data/raw
      - ./backend/db:/app/backend/db  # giữ dữ liệu SQLite qua các lần container restart/recreate
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      # Đổi "8080:80" -> "80:80" khi deploy trên máy chủ có cổng 80 trống (chuẩn thông thường).
      # Đang để 8080 vì máy dev đang test có 1 tiến trình khác (Apache trong WSL2) chiếm cổng 80.
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
