name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Chi cai ruff (khong pip install -r requirements.txt) vi ruff la static analyzer, khong
      # can toan bo dependency nang (torch, sqlalchemy...) de chay - giu job lint nhanh, gon.
      # Ghim dung version voi requirements.txt de dong bo ket qua giua may dev va CI.
      - run: pip install ruff==0.16.5
      # Cau hinh o ruff.toml (repo root) - CHI bat nhom rule "F" (pyflakes: import/bien khong
      # dung, loi cu phap ro rang) co chu dich, xem comment trong file do de biet ly do.
      - run: ruff check backend/ src/ tests/

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # QUAN TRONG: cai torch tu index CPU-only truoc requirements.txt. Neu khong, tren Linux
      # pip mac dinh keo theo toan bo CUDA/GPU toolkit (nvidia-*, triton...) du CI chi chay CPU -
      # phat hien khi lam CP6.3 (Docker), ap dung lai o day de khong ton bang thong/thoi gian CI.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # Cac test can data/raw/ hoac saved_models/ (gitignored, khong co tren CI runner) tu dong
      # skip qua marker requires_physionet_data/requires_saved_model/requires_onnx_model trong
      # tests/conftest.py - khong can lam gi them o day.
      - run: pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests (skip if Vitest chưa được thêm)
        run: |
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "Chưa có script 'test' trong package.json (Vitest chưa được thêm) - bỏ qua."
          fi

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend.Dockerfile -t ecg-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend.Dockerfile -t ecg-frontend:ci .

      # Chi bao cao lo hong (exit-code 0, khong lam CI do) - anh nen (python:3.12-slim,
      # node:20-alpine, nginx:alpine) co the co vai CVE chua vá o thoi diem bat ky, khong phai
      # loi cua repo nay. Xem ket qua trong tab Security > Code scanning cua GitHub, quyet dinh
      # sau co can nang tieu chi len (vd fail neu CRITICAL) hay khong.
      # Ghim @master (khong ghim version cu the) vi khong xac minh duoc tag chinh xac dang ton
      # tai luc viet workflow nay (khong co mang truy cap GitHub luc do) - uu tien chac chan
      # resolve duoc hon la doan mot version co the sai. Co the doi sang tag co dinh (vd @0.29.0)
      # sau khi xac nhan tag do ton tai, de on dinh/an toan hon (@master la nhanh dong, co the doi).
      - name: Scan backend image for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecg-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Smoke test: dung docker compose that (khong co saved_models/data/raw that vi gitignored
      # nen AI se bao "khong tim thay model" - binh thuong, chi kiem tra container khong crash
      # va server tra loi duoc request, KHONG kiem tra ket qua AI dung/sai).
      - name: docker compose smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 1
          done
          docker compose ps
          curl -sf http://localhost:8000/ | grep -q "online" || (docker compose logs && exit 1)
          curl -sf http://localhost:80/ > /dev/null || (docker compose logs && exit 1)
          docker compose down
