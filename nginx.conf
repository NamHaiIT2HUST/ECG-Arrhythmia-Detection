# CP6.3: Nginx phuc vu file tinh React (build san) + reverse proxy /api va /ws sang service backend.
#
# LUU Y QUAN TRONG: frontend hien tai (frontend/src/api/axios.js, DashboardPage.jsx) dang GOI
# THANG "http://localhost:8000" (hardcode), CHUA dung duong dan tuong doi qua proxy nay. Vi vay
# docker-compose.yml van publish port 8000 cua backend ra host de code hien tai chay dung khong
# can sua gi. Cau hinh proxy /api, /ws duoi day de san sang cho luc frontend doi sang goi duong
# dan tuong doi (vd fetch('/api/records') thay vi 'http://localhost:8000/api/records') - luc do
# chi can sua phia frontend, khong can sua lai nginx.conf nay.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
