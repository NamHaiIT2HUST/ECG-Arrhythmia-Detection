# CP6.3: Nginx phuc vu file tinh React (build san) + reverse proxy /api va /ws sang service backend.
#
# Frontend (frontend/src/utils/serverUrl.js) mac dinh goi duong dan TUONG DOI (vd fetch('/api/records')
# thay vi hardcode 'http://localhost:8000/api/records') - proxy /api, /ws duoi day chinh la thu
# lam cho cach goi do hoat dong dung: bat ky may nao mo trang qua Nginx (port 80) deu tu dong
# duoc proxy sang dung backend, khong can tung nguoi tu sua dia chi trong Cai Dat He Thong.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
